[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meanmug"
version = "0.1.0"
description = "MeanMug — a Discord-native agent bot."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
]

[project.scripts]
meanmug = "meanmug.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/meanmug"]

[tool.ruff]
line-length = 100
target-version = "py311"
